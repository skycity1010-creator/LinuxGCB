  "checks": [
    {
      "id": 900242,
      "title": "TWGCB-01-012-0242 firewalld防火牆套件",
      "description": "合規值: firewalld 已安裝",
      "rationale": "人工檢核指令（來源）：dnf install firewalld",
      "compliance": [
        {
          "twgcb": [
            "TWGCB-01-012-0242"
          ]
        }
      ],
      "regex_type": "pcre2",
      "condition": "all",
      "rules": [
        "c:/usr/bin/rpm -q --queryformat %{NAME}:installed firewalld -> r:^firewalld:installed$"
      ]
    },
    {
      "id": 900243,
      "title": "TWGCB-01-012-0243 firewalld服務",
      "description": "合規值: firewalld enabled+active",
      "rationale": "人工檢核指令（來源）：systemctl --now enable firewalld",
      "compliance": [
        {
          "twgcb": [
            "TWGCB-01-012-0243"
          ]
        }
      ],
      "regex_type": "pcre2",
      "condition": "all",
      "rules": [
        "c:/usr/bin/systemctl show firewalld.service --property=LoadState -> r:^LoadState=loaded$",
        "c:/usr/bin/systemctl show firewalld.service --property=ActiveState -> r:^ActiveState=active$",
        "c:/usr/bin/systemctl show firewalld.service --property=UnitFileState -> r:^UnitFileState=enabled$"
      ]
    },
    {
      "id": 900244,
      "title": "TWGCB-01-012-0244 iptables服務",
      "description": "合規值: iptables masked+inactive",
      "rationale": "人工檢核指令（來源）：systemctl --now mask iptables ； systemctl --now mask ip6tables",
      "compliance": [
        {
          "twgcb": [
            "TWGCB-01-012-0244"
          ]
        }
      ],
      "regex_type": "pcre2",
      "condition": "all",
      "rules": [
        "c:/usr/bin/python3 -c \"\\\"\\\"\\\"Read-only observations; no shell or service mutations.\\\"\\\"\\\"\nimport os\nimport re\nimport subprocess\n\n\ndef observe(argv, states):\n    result = subprocess.run(argv, capture_output=True, text=True, timeout=8,\n                            env=dict(os.environ, LC_ALL='C'))\n    value = result.stdout.strip()\n    return not result.stderr and (value, result.returncode) in states\n\n\ndef check(n):\n    if n == 244:\n        for service in ('iptables', 'ip6tables'):\n            if not observe(['/usr/bin/systemctl', 'is-enabled', service], {('masked', 1)}):\n                return False\n            if not observe(['/usr/bin/systemctl', 'is-active', service], {('inactive', 3)}):\n                return False\n        return True\n    if n == 246:\n        result = subprocess.run(['/usr/bin/firewall-cmd', '--get-default-zone'],\n                                capture_output=True, text=True, timeout=8,\n                                env=dict(os.environ, LC_ALL='C'))\n        return (result.returncode == 0 and not result.stderr and\n                re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_-]*', result.stdout.strip()) is not None)\n    return False\n\n\\\"\\\"\\\"0244: absent or disabled services must also be inactive.\\\"\\\"\\\"\ndef disabled_service(service):\n    result = subprocess.run(['/usr/bin/systemctl', 'is-enabled', service],\n                            capture_output=True, text=True, timeout=8,\n                            env=dict(os.environ, LC_ALL='C'))\n    value, error = result.stdout.strip(), result.stderr.strip()\n    if not error and (value, result.returncode) in {('disabled', 1), ('masked', 1)}:\n        return True\n    if result.returncode not in (1, 4):\n        return False\n    if not error and value == 'not-found':\n        return True\n    diagnostic = ('Failed to get unit file state for ' + service +\n                  '.service: No such file or directory')\n    return not value and error == diagnostic\n\n\ndef check(n):\n    if n != 244:\n        return False\n    for service in ('iptables', 'ip6tables'):\n        if not disabled_service(service):\n            return False\n        if not observe(['/usr/bin/systemctl', 'is-active', service], {('inactive', 3)}):\n            return False\n    return True\n\ntry:\n    ok = check(244)\nexcept (OSError, ValueError, UnicodeError, subprocess.SubprocessError):\n    ok = False\nif ok:\n    print('PASS')\n\" -> r:^PASS$"
      ]
    },
    {
      "id": 900245,
      "title": "TWGCB-01-012-0245 nftables服務",
      "description": "合規值: nftables masked+inactive",
      "rationale": "人工檢核指令（來源）：systemctl --now mask nftables",
      "compliance": [
